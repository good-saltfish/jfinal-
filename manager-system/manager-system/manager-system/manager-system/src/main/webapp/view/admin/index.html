#@admin_layout()
#define main()
<div class="jumbotron">
    <h1 class="display-4">欢迎, #(admin.student_no)!</h1>
    <hr class="my-4">
    <p>您可以在这里管理学生、课程、成绩和教师信息。</p>
    <div class="row mt-4">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">学生管理</h5>
                    <p class="card-text">管理学生信息</p>
                    <a href="/admin/student" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">课程管理</h5>
                    <p class="card-text">管理课程信息</p>
                    <a href="/admin/course" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">成绩管理</h5>
                    <p class="card-text">管理学生成绩</p>
                    <a href="/admin/score" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">教师管理</h5>
                    <p class="card-text">管理教师信息</p>
                    <a href="/admin/teacher" class="btn btn-primary">进入</a>
                </div>
            </div>
        </div>
    </div>
</div>
#end
