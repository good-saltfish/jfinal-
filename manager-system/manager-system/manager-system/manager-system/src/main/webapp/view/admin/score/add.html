#@admin_layout()
#define main()
<div class="card">
    <div class="card-header">
        <h3 class="card-title">添加成绩</h3>
    </div>
    <div class="card-body">
        <form action="/admin/score/save" method="post">
            <div class="form-group">
                <label>学生</label>
                <select name="score.student_id" class="form-control" required>
                    #for(student : students)
                    <option value="#(student.id)">#(student.student_no) - #(student.name)</option>
                    #end
                </select>
            </div>
            <div class="form-group">
                <label>课程</label>
                <select name="score.course_id" class="form-control" required>
                    #for(course : courses)
                    <option value="#(course.id)">#(course.course_name)</option>
                    #end
                </select>
            </div>
            <div class="form-group">
                <label>成绩</label>
                <input type="number" step="0.5" name="score.score" class="form-control" required>
            </div>
            <div class="form-group">
                <label>学期</label>
                <input type="text" name="score.semester" value="#(currentSemester)" class="form-control" readonly>
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/admin/score" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
#end
