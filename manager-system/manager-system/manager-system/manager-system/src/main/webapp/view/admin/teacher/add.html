#@admin_layout()
#define main()
<div class="card">
    <div class="card-header">
        <h3 class="card-title">添加教师</h3>
    </div>
    <div class="card-body">
        <form action="/admin/teacher/save" method="post">
            <div class="form-group">
                <label>工号</label>
                <input type="text" name="teacher.teacher_no" class="form-control" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="teacher.name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>职称</label>
                <select name="teacher.title" class="form-control">
                    <option value="教授">教授</option>
                    <option value="副教授">副教授</option>
                    <option value="讲师">讲师</option>
                </select>
            </div>
            <div class="form-group">
                <label>电话</label>
                <input type="tel" name="teacher.phone" class="form-control">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="teacher.email" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/admin/teacher" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
#end
