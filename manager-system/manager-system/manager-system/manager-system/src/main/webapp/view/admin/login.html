<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" rel="stylesheet">
    <img src="http://jwgl.fafu.edu.cn/(taeflu455bii1qessgar3w55)/logo/logo_school.png" alt="School Logo">
    <img src="http://jwgl.fafu.edu.cn/(taeflu455bii1qessgar3w55)/logo/logo_jw.png" alt="School Logo0" >
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">管理员登录</h3>
                    </div>
                    <div class="card-body">
                        <form action="/admin/login/login" method="post">
                            #if(error)
                            <div class="alert alert-danger">#(error)</div>
                            #end
                            <div class="form-group">
                                <label>用户名</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>密码</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
