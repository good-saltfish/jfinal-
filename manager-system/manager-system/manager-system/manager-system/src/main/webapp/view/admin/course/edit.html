#@admin_layout()
#define main()
<div class="card">
    <div class="card-header">
        <h3 class="card-title">编辑课程</h3>
    </div>
    <div class="card-body">
        <form action="/admin/course/update" method="post">
            <input type="hidden" name="course.id" value="#(course.id)">
            <div class="form-group">
                <label>课程编号</label>
                <input type="text" name="course.course_code" value="#(course.course_code)" class="form-control" required>
            </div>
            <div class="form-group">
                <label>课程名称</label>
                <input type="text" name="course.course_name" value="#(course.course_name)" class="form-control" required>
            </div>
            <div class="form-group">
                <label>学分</label>
                <input type="number" step="0.5" name="course.credit" value="#(course.credit)" class="form-control" required>
            </div>
            <div class="form-group">
                <label>任课教师</label>
                <select name="course.teacher_id" class="form-control">
                    #for(teacher : teachers)
                    <option value="#(teacher.id)" #if(teacher.id == course.teacher_id)selected#end>
                        #(teacher.name)
                    </option>
                    #end
                </select>
            </div>
            <div class="form-group">
                <label>课程状态</label>
                <select name="course.status" class="form-control">
                    <option value="not_started" #if(course.status == "not_started")selected#end>未开课</option>
                    <option value="in_progress" #if(course.status == "in_progress")selected#end>进行中</option>
                    <option value="ended" #if(course.status == "ended")selected#end>已结束</option>
                </select>
            </div>
            <div class="form-group">
                <label>上课时间</label>
                <input type="text" name="course.class_time" value="#(course.class_time)" class="form-control" placeholder="例如：周一 1-2节">
            </div>
            <div class="form-group">
                <label>上课地点</label>
                <input type="text" name="course.classroom" value="#(course.classroom)" class="form-control" placeholder="例如：教学楼101">
            </div>
            <div class="form-group">
                <label>课程描述</label>
                <textarea name="course.description" class="form-control" rows="3">#(course.description)</textarea>
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/admin/course" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
#end
