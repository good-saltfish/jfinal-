#@admin_layout()
#define main()
<div class="card">
    <div class="card-header">
        <h3 class="card-title">编辑教师</h3>
    </div>
    <div class="card-body">
        <form action="/admin/teacher/update" method="post">
            <input type="hidden" name="teacher.id" value="#(teacher.id)">
            <div class="form-group">
                <label>工号</label>
                <input type="text" name="teacher.teacher_no" value="#(teacher.teacher_no)" class="form-control" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="teacher.name" value="#(teacher.name)" class="form-control" required>
            </div>
            <div class="form-group">
                <label>职称</label>
                <select name="teacher.title" class="form-control">
                    <option value="教授" #if(teacher.title == "教授")selected#end>教授</option>
                    <option value="副教授" #if(teacher.title == "副教授")selected#end>副教授</option>
                    <option value="讲师" #if(teacher.title == "讲师")selected#end>讲师</option>
                </select>
            </div>
            <div class="form-group">
                <label>电话</label>
                <input type="tel" name="teacher.phone" value="#(teacher.phone)" class="form-control">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="teacher.email" value="#(teacher.email)" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/admin/teacher" class="btn btn-secondary">返回</a>
        </form>
    </div>
</div>
#end
