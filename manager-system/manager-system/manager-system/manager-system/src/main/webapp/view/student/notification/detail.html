#@student_layout()
#define main()
<div class="container">


    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <h5 class="card-title mb-1">#(notification.title)</h5>
                <div class="small text-muted">
                    <i class="far fa-clock"></i> #date(notification.createdAt, "yyyy-MM-dd HH:mm")
                </div>
            </div>
            <div>
                #if(!notification.isRead)
                    <span class="badge badge-primary">未读</span>
                #end
            </div>
        </div>
        <div class="card-body">
            <div class="notification-content">
                #(notification.content)
            </div>
        </div>
        <div class="card-footer">
            <a href="/student/notification" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回列表
            </a>
        </div>
    </div>
</div>

<style>
.notification-content {
    line-height: 1.6;
    white-space: pre-wrap;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 4px;
}
</style>
#end
